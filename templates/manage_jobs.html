<!DOCTYPE html>
<html>
<head><title>Manage Jobs</title></head>
<body>
  <h2>Manage Jobs</h2>
  <a href="{% url 'add_job' %}">+ Add Job</a>
  <table border="1" cellpadding="8" cellspacing="0">
    <tr>
      <th>Title</th><th>Department</th><th>Location</th><th>Actions</th>
    </tr>
    {% for job in jobs %}
    <tr>
      <td>{{ job.title }}</td>
      <td>{{ job.department }}</td>
      <td>{{ job.location }}</td>
      <td>
        <a href="{% url 'edit_job' job.id %}">Edit</a> |
        <a href="{% url 'delete_job' job.id %}" onclick="return confirm('Are you sure?')">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No jobs found.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
