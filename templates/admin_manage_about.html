{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit About Content</title>
  <link rel="stylesheet" href="{% static 'css/admin_manage_about.css' %}">
    <style>
    :root {
      --bg: #f0f2f5;
      --text: #333;
      --card-bg: #fff;
      --card-hover: #32cd32;
      --primary: #2e8b57;
      --header-bg: #1a1a1a;
      --footer-text: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      background-color: var(--header-bg);
      padding: 1rem 2rem;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--card-hover);
    }

    .dashboard {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      border-top: 4px solid var(--card-hover);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 16px rgba(50, 205, 50, 0.2);
    }

    .card h3 {
      margin-bottom: 1rem;
      color: var(--primary);
    }

    .card a {
      display: inline-block;
      margin-top: 1rem;
      color: white;
      background-color: var(--primary);
      padding: 0.6rem 1.2rem;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
    }

    .card a:hover {
      background-color: #1e6b43;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">LoRa Admin Dashboard</div>
    <div>Welcome, Admin</div>
  </header>
</head>
<body>
  <div class="container">
    <h2>Edit About Page Content</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save Changes</button>
    </form>
    <a href="{% url 'admin_dashboard' %}">← Back to Dashboard</a>
  </div>
</body>
</html>
